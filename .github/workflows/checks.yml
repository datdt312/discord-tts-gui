name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository structure and documentation
        run: python tools/check_repo.py
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv python3-pyqt5 python3-aiohttp libsndfile1 libportaudio2 ffmpeg pulseaudio-utils espeak-ng xauth desktop-file-utils
          python -m pip install -r requirements-desktop.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -t . -v
      - name: Verify clean source export
        run: python tools/export_source.py
